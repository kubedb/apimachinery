
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: placementpolicies.apps.k8s.appscode.com
spec:
  group: apps.k8s.appscode.com
  names:
    kind: PlacementPolicy
    listKind: PlacementPolicyList
    plural: placementpolicies
    singular: placementpolicy
  scope: Cluster
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: |-
          PlacementPolicy represents a set of pods with consistent identities.
          Identities are defined as:
            - Network: A single stable DNS and hostname.
            - Storage: As many VolumeClaims as requested.

          The PlacementPolicy guarantees that a given network identity will always
          map to the same storage identity.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired identities of pods in this set.
            properties:
              affinity:
                description: If specified, the pod's scheduling constraints
                properties:
                  nodeAffinity:
                    description: Describes node affinity scheduling rules for the
                      pod.
                    items:
                      properties:
                        domains:
                          items:
                            properties:
                              replicas:
                                type: string
                              values:
                                items:
                                  type: string
                                type: array
                            required:
                            - replicas
                            - values
                            type: object
                          type: array
                        topologyKey:
                          type: string
                        weight:
                          default: 50
                          description: Weight associated with matching the corresponding
                            nodeSelectorTerm, in the range 1-100.
                          format: int32
                          type: integer
                        whenUnsatisfiable:
                          default: DoNotSchedule
                          type: string
                      required:
                      - domains
                      - topologyKey
                      - weight
                      - whenUnsatisfiable
                      type: object
                    type: array
                type: object
              clusterSpreadConstraint:
                description: ClusterSpreadConstraint provides spec for distributed
                  pod placements
                properties:
                  distributionRules:
                    items:
                      properties:
                        clusterName:
                          type: string
                        monitoring:
                          properties:
                            prometheus:
                              properties:
                                appBindingRef:
                                  description: ObjectReference contains enough information
                                    to let you inspect or modify the referred object.
                                  properties:
                                    name:
                                      description: |-
                                        Name of the referent.
                                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                      type: string
                                    namespace:
                                      description: |-
                                        Namespace of the referent.
                                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                                      type: string
                                  required:
                                  - name
                                  type: object
                                authSecret:
                                  description: |-
                                    Secret is the name of the secret to create in the AppBinding's
                                    namespace that will hold the credentials associated with the AppBinding.
                                  properties:
                                    name:
                                      description: |-
                                        Name of the referent.
                                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                      type: string
                                    namespace:
                                      description: |-
                                        Namespace of the referent.
                                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                                      type: string
                                  required:
                                  - name
                                  type: object
                                caBundle:
                                  description: CABundle is a PEM encoded CA bundle
                                    which will be used to validate the serving certificate
                                    of this app.
                                  format: byte
                                  type: string
                                insecureSkipTLSVerify:
                                  description: |-
                                    InsecureSkipTLSVerify disables TLS certificate verification when communicating with this app.
                                    This is strongly discouraged.  You should use the CABundle instead.
                                  type: boolean
                                serverName:
                                  description: |-
                                    ServerName is used to verify the hostname on the returned
                                    certificates unless InsecureSkipVerify is given. It is also included
                                    in the client's handshake to support virtual hosting unless it is
                                    an IP address.
                                  type: string
                                tlsSecret:
                                  description: |-
                                    TLSSecret is the name of the secret that will hold
                                    the client certificate and private key associated with the AppBinding.
                                  properties:
                                    name:
                                      description: |-
                                        Name of the referent.
                                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                      type: string
                                    namespace:
                                      description: |-
                                        Namespace of the referent.
                                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                                      type: string
                                  required:
                                  - name
                                  type: object
                                url:
                                  description: |-
                                    `url` gives the location of the app, in standard URL form
                                    (`[scheme://]host:port/path`). Exactly one of `url` or `service`
                                    must be specified.
                                  type: string
                              type: object
                          type: object
                        replicaIndices:
                          description: |-
                            ReplicaIndices are the pod ordinals this cluster runs. For a database with
                            node roles (topology mode) leave it empty and set Topology instead.
                          items:
                            format: int32
                            type: integer
                          type: array
                        role:
                          description: |-
                            Role describes how this data center participates in DC/DR failover.
                            Member: data bearing and primary eligible (a candidate for the primary DC).
                            Arbiter: votes only, holds no data, never primary.
                            Witness: data bearing but never primary (for engines like MongoDB whose
                            witness must carry data to satisfy majority writes, yet must not be elected).
                            Defaults to Member when empty.
                          enum:
                          - Member
                          - Arbiter
                          - Witness
                          type: string
                        storageClassName:
                          type: string
                        topology:
                          additionalProperties:
                            items:
                              format: int32
                              type: integer
                            type: array
                          description: |-
                            Topology places a database's node roles, for databases that run several
                            kinds of nodes (for example Elasticsearch master, ingest and data nodes).
                            The key is the role name as used in the database's spec.topology, the value
                            lists the ordinals of that role this cluster runs, numbered across all
                            clusters like ReplicaIndices. A rule sets either ReplicaIndices or Topology.
                          type: object
                      required:
                      - clusterName
                      type: object
                    type: array
                  failoverPolicy:
                    description: |-
                      FailoverPolicy, when set, marks this as a cross data center (DC/DR) deployment
                      and selects how the common DC failover service drives failover for it.
                      When nil, the placement is not managed for DC/DR.
                    properties:
                      failoverGroupRef:
                        description: |-
                          FailoverGroupRef names the FailoverGroup this workload fails over with. Every
                          group is backed by its own primary-dc-<group> Lease. When nil, the workload
                          follows the global primary-dc Lease. The referenced FailoverGroup object is not
                          required for failover: the Lease is derived from this reference alone, the
                          object only adds ordering (dependsOn) and status.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      mode:
                        description: |-
                          Mode is the DC topology. It can be derived from the per rule roles
                          (two Members plus an Arbiter or Witness is TwoDC, three Members is ThreeDC);
                          when set it is validated against the roles.
                        enum:
                        - TwoDC
                        - ThreeDC
                        type: string
                    type: object
                  slice:
                    properties:
                      projectNamespace:
                        type: string
                      sliceName:
                        type: string
                    required:
                    - projectNamespace
                    - sliceName
                    type: object
                required:
                - distributionRules
                - slice
                type: object
              nodeSpreadConstraint:
                properties:
                  maxSkew:
                    default: 1
                    format: int32
                    type: integer
                  whenUnsatisfiable:
                    default: DoNotSchedule
                    type: string
                required:
                - maxSkew
                - whenUnsatisfiable
                type: object
              zoneSpreadConstraint:
                properties:
                  maxSkew:
                    default: 1
                    format: int32
                    type: integer
                  whenUnsatisfiable:
                    default: DoNotSchedule
                    type: string
                required:
                - maxSkew
                - whenUnsatisfiable
                type: object
            type: object
        type: object
    served: true
    storage: true
