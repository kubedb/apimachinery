apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    app.kubernetes.io/name: kubedb
  name: milvusinsights.ui.kubedb.com
spec:
  group: ui.kubedb.com
  names:
    kind: MilvusInsight
    listKind: MilvusInsightList
    plural: milvusinsights
    singular: milvusinsight
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              deployMode:
                type: string
              healthy:
                type: boolean
              loadedCollections:
                format: int32
                type: integer
              nodes:
                items:
                  properties:
                    desired:
                      format: int32
                      type: integer
                    hasError:
                      type: boolean
                    ready:
                      format: int32
                      type: integer
                    type:
                      type: string
                  required:
                  - ready
                  - type
                  type: object
                type: array
              status:
                enum:
                - Provisioning
                - DataRestoring
                - Ready
                - Critical
                - NotReady
                - Halted
                - Unknown
                type: string
              totalCollections:
                format: int32
                type: integer
              totalDatabases:
                format: int32
                type: integer
              totalResourceGroups:
                format: int32
                type: integer
              totalRows:
                format: int64
                type: integer
              type:
                enum:
                - Standalone
                - Distributed
                type: string
              unhealthyReasons:
                items:
                  type: string
                type: array
              version:
                type: string
            required:
            - healthy
            - status
            - type
            - version
            type: object
          status:
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      type: integer
                    reason:
                      type: string
                    severity:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - status
                  - type
                  type: object
                type: array
              disasterRecovery:
                properties:
                  activeDC:
                    type: string
                  dataCenters:
                    items:
                      properties:
                        clusterID:
                          type: string
                        clusterName:
                          type: string
                        healthy:
                          type: boolean
                        lagObservedAt:
                          format: date-time
                          type: string
                        lagSeconds:
                          format: int64
                          type: integer
                        lastSeenAt:
                          format: date-time
                          type: string
                        reachable:
                          type: boolean
                        replicationRole:
                          type: string
                      required:
                      - clusterName
                      type: object
                    type: array
                  lastProtectedAt:
                    format: date-time
                    type: string
                  lastTransitionTime:
                    format: date-time
                    type: string
                  phase:
                    type: string
                  promotion:
                    properties:
                      dc:
                        type: string
                      forced:
                        type: boolean
                      from:
                        type: string
                      fromLastSeenAt:
                        format: date-time
                        type: string
                      salvageCheckpoints:
                        items:
                          properties:
                            pchannel:
                              type: string
                            timeTick:
                              format: int64
                              type: integer
                          required:
                          - pchannel
                          - timeTick
                          type: object
                        type: array
                      time:
                        format: date-time
                        type: string
                    required:
                    - dc
                    type: object
                  protected:
                    type: boolean
                  protectionMessage:
                    type: string
                  rebuild:
                    properties:
                      dc:
                        type: string
                      message:
                        type: string
                      startedAt:
                        format: date-time
                        type: string
                      step:
                        type: string
                    required:
                    - dc
                    - step
                    type: object
                type: object
              observedGeneration:
                format: int64
                type: integer
              phase:
                enum:
                - Provisioning
                - DataRestoring
                - Ready
                - Critical
                - NotReady
                - Halted
                - Unknown
                type: string
            type: object
        type: object
    served: true
    storage: true
