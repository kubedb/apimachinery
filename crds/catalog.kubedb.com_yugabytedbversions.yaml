apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    app.kubernetes.io/name: kubedb
  name: yugabytedbversions.catalog.kubedb.com
spec:
  group: catalog.kubedb.com
  names:
    categories:
    - catalog
    - kubedb
    - appscode
    kind: YugabyteDBVersion
    listKind: YugabyteDBVersionList
    plural: yugabytedbversions
    shortNames:
    - ybversion
    singular: yugabytedbversion
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .spec.db.image
      name: DB_IMAGE
      type: string
    - jsonPath: .spec.deprecated
      name: Deprecated
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              archiver:
                properties:
                  addon:
                    properties:
                      name:
                        enum:
                        - mongodb-addon
                        - postgres-addon
                        - mysql-addon
                        - mariadb-addon
                        - mssqlserver-addon
                        - clickhouse-addon
                        - neo4j-addon
                        - documentdb-addon
                        - milvus-addon
                        - yugabytedb-addon
                        type: string
                      tasks:
                        properties:
                          fullBackup:
                            properties:
                              name:
                                type: string
                            required:
                            - name
                            type: object
                          fullBackupRestore:
                            properties:
                              name:
                                type: string
                            required:
                            - name
                            type: object
                          incBackupRestore:
                            properties:
                              name:
                                type: string
                            required:
                            - name
                            type: object
                          manifestBackup:
                            properties:
                              name:
                                type: string
                            required:
                            - name
                            type: object
                          manifestRestore:
                            properties:
                              name:
                                type: string
                            required:
                            - name
                            type: object
                          volumeSnapshot:
                            properties:
                              name:
                                type: string
                            required:
                            - name
                            type: object
                        type: object
                    type: object
                  walg:
                    properties:
                      image:
                        type: string
                    required:
                    - image
                    type: object
                type: object
              build:
                type: string
              db:
                properties:
                  image:
                    type: string
                required:
                - image
                type: object
              defaultFlags:
                properties:
                  master:
                    additionalProperties:
                      type: string
                    type: object
                  tserver:
                    additionalProperties:
                      type: string
                    type: object
                type: object
              deprecated:
                type: boolean
              endOfLife:
                type: boolean
              features:
                properties:
                  clientOnlyCertReload:
                    type: boolean
                type: object
              memory:
                properties:
                  masterLimitPercent:
                    default: 85
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  tserverLimitPercent:
                    default: 70
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                type: object
              securityContext:
                properties:
                  runAsUser:
                    format: int64
                    type: integer
                type: object
              ui:
                items:
                  properties:
                    disable:
                      type: boolean
                    name:
                      type: string
                    values:
                      x-kubernetes-preserve-unknown-fields: true
                    version:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              updateConstraints:
                properties:
                  allowlist:
                    items:
                      type: string
                    type: array
                  denylist:
                    items:
                      type: string
                    type: array
                type: object
              version:
                type: string
              ysqlMajorVersion:
                format: int32
                type: integer
            required:
            - db
            - version
            - ysqlMajorVersion
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
