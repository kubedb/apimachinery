apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    app.kubernetes.io/name: kubedb
  name: documentdbschemaoverviews.ui.kubedb.com
spec:
  group: ui.kubedb.com
  names:
    kind: DocumentDBSchemaOverview
    listKind: DocumentDBSchemaOverviewList
    plural: documentdbschemaoverviews
    singular: documentdbschemaoverview
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              collections:
                items:
                  properties:
                    databaseName:
                      type: string
                    documentCount:
                      format: int64
                      type: integer
                    indexCount:
                      format: int32
                      type: integer
                    name:
                      type: string
                    sizeBytes:
                      format: int64
                      type: integer
                    storageSizeBytes:
                      format: int64
                      type: integer
                    totalIndexSizeBytes:
                      format: int64
                      type: integer
                  required:
                  - databaseName
                  - name
                  type: object
                type: array
            required:
            - collections
            type: object
        type: object
    served: true
    storage: true
