apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    app.kubernetes.io/name: kubedb
  name: documentdbqueries.ui.kubedb.com
spec:
  group: ui.kubedb.com
  names:
    kind: DocumentDBQueries
    listKind: DocumentDBQueriesList
    plural: documentdbqueries
    singular: documentdbqueries
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              queries:
                items:
                  properties:
                    calls:
                      format: int64
                      type: integer
                    databaseName:
                      type: string
                    maxTimeMilliSeconds:
                      type: number
                    meanTimeMilliSeconds:
                      type: number
                    minTimeMilliSeconds:
                      type: number
                    query:
                      type: string
                    rows:
                      format: int64
                      type: integer
                    sharedBlksHit:
                      format: int64
                      type: integer
                    sharedBlksRead:
                      format: int64
                      type: integer
                    totalTimeMilliSeconds:
                      type: number
                  required:
                  - query
                  type: object
                type: array
            required:
            - queries
            type: object
        type: object
    served: true
    storage: true
