apiVersion: ops.kubedb.com/v1alpha1
kind: YugabyteDBOpsRequest
metadata:
  name: yb-reconfigure
  namespace: demo
spec:
  type: Reconfigure
  databaseRef:
    name: yb-demo
  configuration:
    applyConfig:
      tserver.flags: |
        --ysql_max_connections=400
      ysql_pg.conf: |
        work_mem = 8MB
    restart: auto
